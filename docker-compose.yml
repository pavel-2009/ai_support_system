services:
  postgres:
    image: "postgres:13-alpine"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$LLM_MODEL"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  migrate:
    build: ./app
    command: alembic upgrade head
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mydatabase
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: ./app
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mydatabase
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.1}
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully

  celery:
    build: ./app
    command: celery -A main:celery_app worker --loglevel=info
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mydatabase
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.1}
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  postgres_data:
  ollama_data:
