services:
  postgres:
    image: "postgres:13-alpine"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  migrate:
    build: ./app
    command: alembic upgrade head
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mydatabase
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: ./app
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mydatabase
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  celery:
    build: ./app
    command: celery -A main:celery_app worker --loglevel=info
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mydatabase
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
